# cezanne-voice: noise reduction for everything that records from the
# microphone. A filter chain with the RNNoise plugin (cezanne-rnnoise.so) in
# its own PipeWire client process (cezanne-voice.service), as a WirePlumber
# smart filter: streams that record from the default source are linked to
# its output, its input follows the default source (internal or headset
# mic). Streams that name a source (target.object) bypass it: the call
# chain (call.conf.in) does that, as echo cancelling must come first.
# On / off: ~/.config/cezanne/noise-reduction (the Power app); off, the
# plugin passes the sound through.

context.properties = {
    log.level = 0
}

context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
        args = { }
        flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }

    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Microphone (noise reduction)"
            media.name       = "Microphone (noise reduction)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/cezanne-rnnoise.so
                        label  = cezanne_rnnoise
                    }
                ]
            }
            # RNNoise runs at 48 kHz on one channel: the main (bottom) mic,
            # FL of the internal pair (UCM: main AIN0 left, back AIN2 right)
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name      = "cezanne_voice.capture"
                node.passive   = true
                audio.position = [ FL ]
            }
            playback.props = {
                node.name         = "cezanne_voice.mic"
                media.class       = Audio/Source
                filter.smart      = true
                filter.smart.name = "cezanne-noise-reduction"
            }
        }
    }
]
