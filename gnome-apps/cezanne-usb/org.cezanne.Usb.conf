<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- cezanne-usbd: anyone may read; SetMode is checked with polkit -->
<busconfig>
  <policy user="root">
    <allow own="org.cezanne.Usb"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.cezanne.Usb"/>
  </policy>
</busconfig>
