<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="1" stop-color="#241f31"/>
    </linearGradient>
  </defs>
  <!-- infrared waves -->
  <g fill="none" stroke="#e01b24" stroke-linecap="round" stroke-width="6" opacity="0.9">
    <path d="M44 22 a28 28 0 0 1 40 0"/>
    <path d="M34 10 a42 42 0 0 1 60 0" opacity="0.6"/>
  </g>
  <!-- remote body -->
  <rect x="40" y="34" width="48" height="88" rx="14" fill="url(#body)"/>
  <rect x="42" y="36" width="44" height="84" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- IR window -->
  <rect x="54" y="38" width="20" height="5" rx="2.5" fill="#a51d2d"/>
  <!-- power -->
  <circle cx="64" cy="56" r="7" fill="#e01b24"/>
  <!-- d-pad -->
  <circle cx="64" cy="80" r="11" fill="#77767b"/>
  <circle cx="64" cy="80" r="5" fill="#c0bfbc"/>
  <!-- keys -->
  <g fill="#9a9996">
    <rect x="50" y="98" width="10" height="6" rx="3"/>
    <rect x="68" y="98" width="10" height="6" rx="3"/>
    <rect x="50" y="108" width="10" height="6" rx="3"/>
    <rect x="68" y="108" width="10" height="6" rx="3"/>
  </g>
</svg>
