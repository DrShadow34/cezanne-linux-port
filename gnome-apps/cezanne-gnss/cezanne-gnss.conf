# cezanne-gnssd (GNSS location service)
[receiver]
# balanced: at rest (60 s below 0.5 m/s) the receiver tracks in bursts of a
#   few fixes every 30 s; moving again -> continuous
# low: bursts every 2 min after 30 s at rest
# continuous: always tracking (~20..30 mA more while at rest)
mode = balanced
