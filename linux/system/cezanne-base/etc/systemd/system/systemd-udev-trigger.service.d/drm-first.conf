# the display first: Plymouth only draws once udev has processed card0, which
# behind the coldplug of everything else came 0.5-1 s after plymouthd started
# (stock list, drm in front)
[Service]
ExecStart=
ExecStart=-udevadm trigger --type=all --action=add --prioritized-subsystem=drm,module,block,tpmrm,net,tty,input
