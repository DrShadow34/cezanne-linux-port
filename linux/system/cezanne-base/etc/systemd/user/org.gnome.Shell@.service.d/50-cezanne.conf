# GNOME Shell on the phone (user session and GDM greeter); NOTES "GNOME:
# popup menus lag (quick settings)".
[Service]
# cogl's gl3 driver draws St.DrawingArea canvases (popup backgrounds, sliders)
# into a GL pixel buffer and uploads them as RGBA: panfrost maps the buffer
# write-combined, so Mesa's CPU texstore reads it uncached and swizzles
# BGRA -> RGBA byte by byte, ~140 ms per frame while a popup opens. The
# gles2 driver keeps canvases in malloc'd memory and uploads BGRA (memcpy).
Environment=COGL_DRIVER=gles2
# Core placement: cezanne-boost (apps/cezanne-boost) raises the shell's
# uclamp.min while the screen is touched, so EAS runs it on the A77 cores
# then and on the A55 cores otherwise.
