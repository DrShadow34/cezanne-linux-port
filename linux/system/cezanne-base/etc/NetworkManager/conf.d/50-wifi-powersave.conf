# 802.11 power save off while awake (2 = disable): with it on, an idle link
# answers only at the next beacon (ping 3 ms -> 20-200 ms). While suspended
# the driver puts the link into power save itself (WOW fast PSP from the
# suspend-mode PM notifier, wlan-core-gen4m.patch): without that deep
# suspend drew ~177 mA instead of ~88 mA, 2026-10-31.
[connection]
wifi.powersave=2
