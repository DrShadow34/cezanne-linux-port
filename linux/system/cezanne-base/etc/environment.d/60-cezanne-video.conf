# GStreamer's va plugin only accepts the drivers on its vendor list unless
# told otherwise; the cezanne VA driver is not on it.
GST_VA_ALL_DRIVERS=1
# Prefer va*dec (linear NV12, zero-copy to GL / GTK) over v4l2codecs'
# v4l2sl*dec (MM21 output; 1.28's zero-copy path rescales cropped
# streams, see mainline/rootfs/gstreamer). Both default to rank 257.
# v4l2jpegdec (the mtk-jpeg engine, 257) below jpegdec (256): it takes
# baseline 4:2:0 / 4:2:2 only (4:4:4 with halved chroma; grayscale and
# progressive fail), where decodebin should not end up. Pipelines naming
# it still get it; v4l2jpegenc keeps its rank (Snapshot picks it by name).
GST_PLUGIN_FEATURE_RANK=vah264dec:258,vavp9dec:258,vavp8dec:258,v4l2jpegdec:128
