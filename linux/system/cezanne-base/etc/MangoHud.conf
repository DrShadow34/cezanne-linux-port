# cezanne defaults (users override in ~/.config/MangoHud/MangoHud.conf)
fps
frametime
frame_timing
gpu_stats
gpu_temp
gpu_core_clock
vram
cpu_stats
cpu_temp
cpu_mhz
core_load
ram
battery
battery_watt
# control socket per game process: cezanne-hud-pad (L3 held) hides / shows
# the overlay through it
control=mangohud-%p
