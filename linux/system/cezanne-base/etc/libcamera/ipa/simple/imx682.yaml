# SPDX-License-Identifier: CC0-1.0
# Redmi K30 Ultra main camera (IMX682) for libcamera's software ISP.
# The sensor black level is 64 at 10 bits (16 in the 8-bit CAMSV output);
# libcamera wants it on a 16-bit scale.
#
# Colour from Xiaomi's own calibration, in the DNGs MIUI's Pro mode writes
# (backup/camera-ref/scene2/miui-pro.dng): ForwardMatrix1/2 (D65 / Standard
# A) mapped to linear sRGB, with MIUI-like saturation (x1.4) folded in.  The
# white locus: the calibrated neutrals at 2856 K and 4000 K (ColorMatrix2/1
# interpolated), and below that the white of real daylit scenes, which sits
# greener than the calibration (white keys and paper, backup/camera-ref).
# Tone: steeper gamma and a little contrast approximate MIUI's lifted
# midtones with deep shadows (it also tone-maps locally).
