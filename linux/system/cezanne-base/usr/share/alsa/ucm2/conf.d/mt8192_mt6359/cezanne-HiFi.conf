# cezanne (Redmi K30 Ultra). Playback DL1 -> I2S3 -> two CS35L41 (bottom =
# slot 0, top = slot 1, the top one doubles as the earpiece); capture from the
# MT6359 ADCs over MTKAIF -> ADDA UL -> UL1. Amp firmware, calibration and the
# speaker gains: cezanne-audio-init.service. Mic routing as MIUI's
# audio_device.xml (builtin_Mic_DualMic: main AIN0 left, back AIN2 right).

# AFE front end -> back end routes stay up for the whole verb: a DPCM front
# end without a routed back end cannot even be opened (PipeWire probes that).
SectionVerb {
	EnableSequence [
		cset "name='I2S3_CH1 DL1_CH1' on"
		cset "name='I2S3_CH2 DL1_CH2' on"
		cset "name='UL1_CH1 ADDA_UL_CH1' on"
		cset "name='UL1_CH2 ADDA_UL_CH2' on"
	]

	DisableSequence [
		cset "name='I2S3_CH1 DL1_CH1' off"
		cset "name='I2S3_CH2 DL1_CH2' off"
		cset "name='UL1_CH1 ADDA_UL_CH1' off"
		cset "name='UL1_CH2 ADDA_UL_CH2' off"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"
	ConflictingDevice [ "Earpiece" "Speaker2" ]

	EnableSequence [
		cset "name='Top PCM Source' DSP"
		cset "name='Top Analog PCM Volume' 17"
		cset "name='Bottom DSP RX1 Source' ASPRX1"
		cset "name='Bottom DSP RX2 Source' ASPRX2"
		cset "name='Earpiece Switch' off"
		cset "name='Speakers Switch' on"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

# MIUI's media speaker path (SPK_OUT): both amps through their DSPs, the
# bottom one plays the left slot, the top one (earpiece) the right. Both DSP
# inputs of each amp take its own slot (ASPRX1), as MIUI sets them: with RX2
# on ASPRX2 the top amp stays silent. The same PCM as Speaker, so PipeWire
# offers it as a profile of its own. The amps' "music" tuning deltas come
# from cezanne-audio-init (cezanne-amp-usecase).
SectionDevice."Speaker2" {
	Comment "Stereo Speakers"
	ConflictingDevice [ "Speaker" "Earpiece" ]

	EnableSequence [
		cset "name='Top PCM Source' DSP"
		cset "name='Top Analog PCM Volume' 17"
		cset "name='Top DSP RX1 Source' ASPRX1"
		cset "name='Top DSP RX2 Source' ASPRX1"
		cset "name='Bottom DSP RX1 Source' ASPRX1"
		cset "name='Bottom DSP RX2 Source' ASPRX1"
		cset "name='Speakers Switch' on"
		cset "name='Earpiece Switch' on"
	]

	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='Bottom DSP RX2 Source' ASPRX2"
	]

	Value {
		PlaybackPriority 110
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

# MIUI receiver_output: top amp only, straight from the ASP, amp gain 0
SectionDevice."Earpiece" {
	Comment "Earpiece"
	ConflictingDevice [ "Speaker" "Speaker2" "Headphones" ]

	EnableSequence [
		cset "name='Speakers Switch' off"
		cset "name='Earpiece Switch' on"
		cset "name='Top PCM Source' ASP"
		cset "name='Top Analog PCM Volume' 0"
	]

	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='Speakers Switch' on"
		cset "name='Top PCM Source' DSP"
		cset "name='Top Analog PCM Volume' 17"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

# USB-C analog headset (FSA4480 in Audio Accessory Mode): MT6359 headphone
# amp fed by the AFE ADDA DL; the amps' I2S3 routes are cut meanwhile.
# Jack from the Type-C port mode (no mic / button detection yet).
SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [ "Earpiece" ]

	EnableSequence [
		cset "name='ADDA_DL_CH1 DL1_CH1' on"
		cset "name='ADDA_DL_CH2 DL1_CH2' on"
		cset "name='I2S3_CH1 DL1_CH1' off"
		cset "name='I2S3_CH2 DL1_CH2' off"
		cset "name='DAC In Mux' Normal Path"
		cset "name='HP Mux' Audio Playback"
		cset "name='Headset Volume' 10,10"
	]

	DisableSequence [
		cset "name='HP Mux' Open"
		cset "name='I2S3_CH1 DL1_CH1' on"
		cset "name='I2S3_CH2 DL1_CH2' on"
		cset "name='ADDA_DL_CH1 DL1_CH1' off"
		cset "name='ADDA_DL_CH2 DL1_CH2' off"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
		JackControl "Headphone Jack"
	}
}

# headset mic on AIN1 (MIC_BIAS_1), both capture channels
SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH1"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='PGA_L_Mux' AIN1"
		cset "name='PGA1 Volume' 4"
	]

	DisableSequence [
		cset "name='PGA_L_Mux' None"
		cset "name='ADC_L_Mux' Idle"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},10"
		CaptureChannels 2
		CaptureRate 48000
		JackControl "Headset Mic Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphones"

	EnableSequence [
		cset "name='UL_SRC_MUX' AMIC"
		cset "name='MISO0_MUX' UL1_CH1"
		cset "name='MISO1_MUX' UL1_CH2"
		cset "name='ADC_L_Mux' Left Preamplifier"
		cset "name='ADC_R_Mux' Right Preamplifier"
		cset "name='PGA_L_Mux' AIN0"
		cset "name='PGA_R_Mux' AIN2"
		cset "name='PGA1 Volume' 4"
		cset "name='PGA2 Volume' 4"
	]

	DisableSequence [
		cset "name='PGA_L_Mux' None"
		cset "name='PGA_R_Mux' None"
		cset "name='ADC_L_Mux' Idle"
		cset "name='ADC_R_Mux' Idle"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},10"
		CaptureChannels 2
		CaptureRate 48000
	}
}
