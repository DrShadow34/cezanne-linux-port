# makepkg on the laptop / build PC for packages built cross for the phone
# (packaging/cezanne-pkg host NAME): aarch64 packages, no host tools touching
# the binaries.
source /etc/makepkg.conf
CARCH="aarch64"
CHOST="aarch64-unknown-linux-gnu"
OPTIONS=(!strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)
PKGEXT='.pkg.tar.xz'
BUILDDIR=
